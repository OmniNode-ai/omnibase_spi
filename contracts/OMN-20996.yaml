schema_version: "1.0.0"
ticket_id: "OMN-20996"
title: "omnibase_spi: pr-title check runs the omnimarket node"
summary: "Run the published omnimarket title decision locally while preserving the required context and the previous reusable's verdicts."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-pr-title-node"
    statement: "The existing required PR title context is produced by the published omnimarket node."
    acceptance:
      - id: "AC1"
        statement: "AC1: the PR Title Check workflow produces `pr-title / check-title` by running node_pr_title_check_compute from a pinned omnimarket release and no workflow line in pr-title-check.yml references onex_change_control -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k workflow fails at the merge base"
      - id: "AC2"
        statement: "AC2: the installed node's verdicts equal the old reusable's on a table of titles and authors covering every exempt rule, a passing OMN title and a failing title -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k verdicts runs the cases through the installed node and fails on a difference"
      - id: "AC3"
        statement: "AC3: .github/required-checks.yaml names the pr-title row as a local producer -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k manifest fails while the row is cross_repo"
evidence_requirements:
  - kind: "tests"
    description: "Workflow, installed-node parity and local-producer assertions."
    command: "uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-pr-title-workflow"
    description: "The workflow preserves the context and runs the pinned node."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k workflow"
    binds_ac: ["AC1"]
  - id: "dod-pr-title-verdicts"
    description: "The published node agrees with the old bash decision table."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k verdicts"
    binds_ac: ["AC2"]
  - id: "dod-pr-title-manifest"
    description: "The required-check manifest names the local producer."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k manifest"
    binds_ac: ["AC3"]
