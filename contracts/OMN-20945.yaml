schema_version: "1.0.0"
ticket_id: "OMN-20945"
title: "Repair the duplicate mapping key in omnibase_spi's contracts so the strict contract loader accepts them"
summary: "contracts/OMN-20074.yaml wrote the description and command of one evidence item twice, so the strict contract loader that dod-verify uses refuses the file although yaml.safe_load keeps the last value. The earlier pair is removed, the parsed mapping is unchanged, and a test pins every contract in contracts/ to one value per key."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-contracts-strict-load"
    statement: |-
      Every ticket contract in omnibase_spi's contracts/ must load through omnibase_core's load_yaml_mapping_no_duplicates, so dod-verify never refuses one for a duplicate mapping key.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: every contracts/*.yaml loads through load_yaml_mapping_no_duplicates with no duplicate mapping key -- falsifier: uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k every_contract_loads
      - id: "AC2"
        statement: |-
          AC2: the strict loader refuses a mapping that repeats a key, so a passing AC1 is not vacuous -- falsifier: uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k refuses_a_duplicate_key
  - id: "req-scan-all-product-contracts"
    statement: "Every product repository's dev contracts are scanned with the strict loader and each duplicate is listed before a repo bumps its omnimarket pin."
    acceptance:
      - id: "AC3"
        statement: 'AC3: Every contracts/\*.yaml on origin/dev of the nine product repos is scanned with the strict loader and each duplicate found is listed by repo, file, line and key in the PR body, so no repo meets the new refusal unannounced when it bumps its omnimarket pin -- falsifier: the scan, rerun from the canonical clones on a lab host and recorded on the PR body Lab: line, names a duplicate the list omits'
evidence_requirements:
  - kind: "tests"
    description: "Every contract in contracts/ loads through the strict loader."
    command: "uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k every_contract_loads"
  - kind: "tests"
    description: "The strict loader refuses a repeated key."
    command: "uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k refuses_a_duplicate_key"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-contracts-strict-load-ac1"
    description: "The focused test loads every contracts/*.yaml through the strict loader."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k every_contract_loads"
        cwd: "${OMNI_HOME}/omnibase_spi"
    binds_ac: ["AC1"]
  - id: "dod-contracts-strict-load-ac2"
    description: "The focused test shows the strict loader refuses a repeated key."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k refuses_a_duplicate_key"
        cwd: "${OMNI_HOME}/omnibase_spi"
    binds_ac: ["AC2"]
  - id: "dod-contracts-strict-load-ac3"
    description: "AC3, this repository's part of the scan: the focused test scans every contracts/*.yaml in omnibase_spi with load_yaml_mapping_no_duplicates and lists each duplicate by file, line and key (empty here), after a positive control shows a planted duplicate is listed by file, line and key. The scan of all nine product repositories is item dod-omn20945-ac3-duplicates-scanned in omnimarket's contracts/OMN-20945.yaml; this item does not run it."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contracts_strict_load_omn20945.py -q -k ac3"
        cwd: "${OMNI_HOME}/omnibase_spi"
    binds_ac: ["AC3"]
