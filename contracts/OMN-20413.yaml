schema_version: "1.0.0"
ticket_id: OMN-20413
title: The SPDX header hook runs the core runtime module that survives omnibase-core 0.47.81
summary: The validate-spdx-headers hook ran the spdx subcommand that omnibase-core 0.47.81 removed; it now runs the runtime module present in both 0.47.76 and 0.47.81.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-spdx-hook-runtime-module
    statement: The SPDX hook entry runs the core runtime module, not the removed spdx subcommand.
    acceptance:
      - id: AC1
        statement: >-
          AC1: .pre-commit-config.yaml validate-spdx-headers entry runs omnibase_core.nodes.node_spdx_headers_check_compute.runtime_spdx_headers_check -- falsifier: grep for cli_commands spdx validate in .pre-commit-config.yaml matches
evidence_requirements:
  - kind: tests
    description: The launcher-caller tests pass.
    command: uv run pytest tests/ci/test_onex_launcher_callers_omn25070.py -q --no-cov
dod_evidence:
  - id: dod-omn20413-ac1-hook-entry
    description: The hook entry names the runtime module and not the removed subcommand.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: |-
          grep_status=0
          grep -c -F 'cli_commands spdx validate' .pre-commit-config.yaml || grep_status=$?
          test "$grep_status" -eq 1 && grep -q -F runtime_spdx_headers_check .pre-commit-config.yaml
        cwd: .
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_onex_launcher_callers_omn25070.py -q --no-cov
        cwd: .
