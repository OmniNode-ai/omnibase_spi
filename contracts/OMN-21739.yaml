    description: "AC1: the contracts_and_di literal_timeout count over src and scripts is 0 (was 1); total 4 (was 5); the script holds no budget literal."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pin_resolvability_budgets_omn21739.py -q -p no:randomly --no-cov"
    binds_ac: ["AC1"]
  - id: "dod-omn21739-budgets-injected"
    description: "AC2: both budgets come from pyproject.toml or the workflow environment, and the gate's existing tests pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pin_resolvability_budgets_omn21739.py tests/ci/test_verify_pypi_pin_resolvability.py tests/ci/test_pin_resolvability_conflict_report.py tests/ci/test_pin_resolvability_gate_workflow.py -q -p no:randomly --no-cov"
    binds_ac: ["AC2"]
  - id: "dod-omn21739-one-pr"
    description: "AC3: one PR titled with OMN-21739; built in a cloud session, so its proof is the focused test run named in the PR body and the PR's CI (no lab receipt yet)."
    source: "manual"
    checks:
