schema_version: "1.0.0"
ticket_id: OMN-21331
title: omnibase_spi reads omnibase_core through its dev-merge tag for the canonical file shape check
summary: The Canonical File Shape job in omnibase_spi reads omnibase_core through a dev-merge tag instead of a commit sha. The job already runs on pull requests and the merge queue; this pull request carries AC2 and AC4 for omnibase_spi. AC1 is the validator change in omnibase_core and AC3 is a ruleset change per repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21331-omnibase-spi-canonical-file-shape
    statement: The canonical file shape check runs on pull requests and the merge queue in omnibase_spi, refuses a planted new script, and reads omnibase_core through its dev-merge tag.
    acceptance:
      - id: AC2
        statement: "AC2: omnibase_spi runs the canonical file shape check on pull requests and the merge queue and a planted new script is refused there -- falsifier: the planted-sample output in the rollout PR body, and the job's own planted-sample step"
      - id: AC4
        statement: "AC4: the canonical file shape workflow in omnibase_spi reads omnibase_core through the dev-merge tag, not a commit sha -- falsifier: git grep for a 40-hex omnibase_core reference on the CANONICAL_FILE_SHAPE_CORE line returns nothing"
evidence_requirements:
  - kind: ci
    description: The workflow uses the dev-merge tag on pull requests and the merge queue, and its real planted-sample step refuses bad code and accepts canonical test code.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_canonical_file_shape_dev_tag_omn21331.py -q
  - kind: ci
    description: The canonical file shape workflow names a dev-merge tag and no commit sha for omnibase_core.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_canonical_file_shape_dev_tag_omn21331.py -q
