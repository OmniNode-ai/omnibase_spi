schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "omnibase_spi holds no timeout, join-grace, sleep or pin-pair literal: validation scripts read pyproject.toml and protocol shutdown signatures take None for the contract-declared timeout (contracts_and_di burn-down)"
summary: "The contracts_and_di check of omnibase_core reports 47 findings in omnibase_spi (42 literal_timeout, 4 literal_topic, 1 literal_url). This slice moves six of them out of code: the validator subprocess timeout of run_all_validations.py, the timer join grace, the file-operation default timeout and the self-test sleeps of timeout_utils.py, and the pin-pair repo URL of validate_precommit_pin_parity.py. They are declared in [tool.omnibase_spi.validation_scripts] of pyproject.toml; a missing key raises KeyError rather than defaulting. Thirty-six protocol close, shutdown, stop, flush and disconnect signatures declared timeout_seconds: float = 30.0; they now take timeout_seconds: float | None = None, where None selects the timeout the implementation's contract declares, and the protocol signature snapshot is regenerated. The check reads 5 findings after the change (1 literal_timeout in the vendored verify_pypi script, 4 literal_topic in the event registry)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21623-spi-script-settings-from-pyproject"
    statement: "The validation scripts under scripts/validation hold no timeout, join-grace, self-test sleep or pin-pair URL literal; each is read from [tool.omnibase_spi.validation_scripts] in pyproject.toml, and an absent table or key fails loudly."
    acceptance:
      - id: "AC1"
        statement: "AC1: the settings loader returns the declared values, raises KeyError for an absent table or key, and the runner, timeout utilities and pin-parity script read their values through it -- falsifier: uv run pytest tests/unit/validation/test_script_settings_from_pyproject.py -q passes"
      - id: "AC2"
        statement: "AC2: the contracts_and_di check of omnibase_core reports 5 findings for omnibase_spi, down from 47, with no literal_timeout finding left under src/ or scripts/validation and no literal_url finding -- falsifier: runtime_validator_run of omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi over the repository lists no finding under scripts/validation and counts 5 [ERROR] lines"
      - id: "AC3"
        statement: "AC3: every protocol close, shutdown, stop, flush and disconnect signature that carried timeout_seconds: float = 30.0 takes timeout_seconds: float | None = None, and the protocol signature snapshot records the change -- falsifier: uv run pytest tests/test_protocol_snapshot.py tests/test_forward_references.py -q passes and grep -rn 'timeout_seconds: float = 30.0' src returns nothing"
evidence_requirements:
  - kind: "tests"
    description: "The settings loader and the three scripts that read it."
    command: "uv run pytest tests/unit/validation/test_script_settings_from_pyproject.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "The protocol signature snapshot and the handler shutdown signature."
    command: "uv run pytest tests/test_protocol_snapshot.py tests/test_forward_references.py -q -p no:randomly --no-cov"
