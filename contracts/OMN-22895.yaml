schema_version: "1.0.0"
ticket_id: OMN-22895
title: omnibase_spi's security scan runs TruffleHog and a planted secret turns it red
summary: secret-scan.yml gains a secret-scan job on a hosted runner running the TruffleHog image by the digest the reference security-scan.yml pins, with a planted-control step that reads a declared detector, so a commit adding the control token turns the job red and a head without it reads green.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22895-secret-scan
    statement: The repository's security scan runs a secret scanner on a hosted runner with a control that can fail.
    acceptance:
      - id: AC1
        statement: secret-scan.yml runs TruffleHog on a hosted runner at the same pin as the reference security-scan workflow.
      - id: AC2
        statement: A planted control secret on a scratch head turns the scan red and the clean head reads green.
evidence_requirements:
  - kind: tests
    description: Workflow shape test of the secret-scan job and the control detector.
    command: uv run pytest tests/ci/test_secret_scan_workflow_omn22895.py -q -o addopts=''
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22895-ac1-workflow-shape
    description: The secret-scan job runs on a hosted runner and every TruffleHog step runs the digest-pinned image.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_secret_scan_workflow_omn22895.py -q -o addopts='' -k 'hosted_runner or reference_image_digest or verified_only'
        cwd: ${OMNI_HOME}/omnibase_spi
  - id: dod-omn22895-ac2-planted-control
    description: The control detector matches the planted token and ignores clean text and its own file.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_secret_scan_workflow_omn22895.py -q -o addopts='' -k 'control'
        cwd: ${OMNI_HOME}/omnibase_spi
