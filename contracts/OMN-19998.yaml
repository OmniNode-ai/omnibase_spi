schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "omnibase_spi: the api-reference version badge reads the published version, so a release commit needs no docs edit"
summary: "The 15 docs/api-reference pages carried a hard-coded SPI-vX.Y.Z shields badge that tests/unit/test_doc_protocol_imports.py compared with pyproject.toml. The release train's release commit moves CHANGELOG.md, pyproject.toml and uv.lock only (a wider diff is not exempt from the repo-evidence gate), so the 0.23.7 release PR failed that test, Build & Package Verification, Tests Gate and CI Summary. The pages now carry the PyPI-backed badge and the test refuses a hard-coded version badge."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-pypi-version-badge"
    statement: "The api-reference version badge cannot go stale at a release."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: every docs/api-reference page that carries a Version badge points it at https://img.shields.io/pypi/v/omnibase-spi, no doc hard-codes an SPI-vX.Y.Z badge, and the pattern that detects a hard-coded badge matches the badge that went stale in 0.23.7 -- falsifier: uv run pytest tests/unit/test_doc_protocol_imports.py -q fails with the pull request's test file laid over the merge base, where 15 pages hard-code SPI-v0.23.6
  - id: "req-omn19998-public-runner-placement"
    statement: "Operator RULING 2026-10-16T07:07:09Z: CI runners are for private repositories only. omnibase_spi is public, so every workflow job runs on a literal GitHub-hosted label, and omnibase_core's check-public-runner-placement runs as a CI Summary required job and as a pre-commit hook at one core release."
    acceptance:
      - id: "AC2"
        statement: >-
          AC2: no workflow names the self-hosted fleet or computes a runs-on label from a variable, the Public Runner Placement job is unconditional, hosted, carries a positive control and the same core release as the pre-commit hook, and CI Summary requires its success -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q fails at the merge base, where nine workflow jobs fall back to the omnibase-ci fleet and neither the job nor the hook exists
  - id: "req-omn19998-omnibase_spi-dev-merge-tag"
    statement: "Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omnibase_spi, a sibling another platform repository consumes, tags every push to dev with a lightweight dev-<UTC YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other ref, so a consumer can pin it through a uv git source."
    acceptance:
      - id: "AC3"
        statement: "AC3: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q fails at the merge base, where the workflow does not exist"
evidence_requirements:
  - kind: "tests"
    description: "The doc-drift suite reads every markdown doc under the repo's doc globs for a hard-coded version badge and for the PyPI-backed Version badge."
    command: "uv run pytest tests/unit/test_doc_protocol_imports.py -q"
  - kind: "tests"
    description: "The placement tests read every workflow file for the fleet fallback and a computed runs-on, the ci.yml job, .pre-commit-config.yaml and the CI Summary wiring."
    command: "uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-pypi-version-badge"
    description: "The 15 api-reference pages carry the PyPI-backed Version badge, no doc hard-codes an SPI-vX.Y.Z badge, and the detection pattern has a positive control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_doc_protocol_imports.py -q"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-ac2-public-runner-placement"
    description: "AC2 tests read the workflows, the CI job, the pre-commit hook and the CI Summary wiring."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q"
    binds_ac: ["AC2"]
  - id: "dod-omn19998-omnibase_spi-dev-merge-tag"
    description: "The dev merge tag tests pass at the head; at the merge base the workflow file does not exist and every test fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q"
        cwd: "${OMNI_HOME}/omnibase_spi"
    binds_ac: ["AC3"]
  - id: "dod-omn19998-omnibase_spi-dev-tag-probe"
    description: "Hosted-runner probe reads the dev merge tag workflow at this commit and requires its push-to-dev trigger and its tag push; the base has no such file and the probe fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_spi/contents/.github/workflows/dev-merge-tag.yml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | awk '/branches: \[dev\]/{a=1} /git push origin "refs\/tags\//{b=1} END{exit !(a&&b)}'
        cwd: "."
