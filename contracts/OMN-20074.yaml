schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "Repo-owned DoD evidence caller for omnibase_spi, S6 cut-over"
summary: "omnibase_spi enforces repo-owned DoD evidence at the S6 cut-over with shadow and OCC comparison off. The OCC minting callers and their helper are deleted, the runner-IP caller uses the reusable without nested OCC preflight, and Contract Compliance Check validates this repository's contracts with omnibase_core. Focused tests bind the cut-over and each acceptance criterion to runnable evidence."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-evidence-gate"
    statement: |-
      omnibase_spi must enforce repo-owned evidence through a base-branch caller gate without shadow or OCC comparison, and bind every acceptance criterion to runnable test evidence.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omnibase_spi carries a caller workflow for the receipt-gate's caller-evidence mode that runs from the base branch (pull_request_target) on dev and main with read-only permissions and no secrets -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch
      - id: "AC2"
        statement: |-
          AC2: the caller pins OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml at a full 40-character lowercase hexadecimal commit sha other than the pre-floor omnibase_core#1914 squash commit, with a verifier-version of 0.4.305 or later -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate
      - id: "AC3"
        statement: |-
          AC3: the caller sets evidence-source caller, shadow "false" and compare-with-occ "false", so repo-evidence / dod-verify carries the real verdict of this repository's own contracts without comparing with OCC -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k shadow_mode
      - id: "AC4"
        statement: |-
          AC4: the S6 cut-over deletes call-occ-autobind.yml, call-occ-companion-effect.yml and their helper scripts/ci/occ_manual_replay_precheck.py -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_callers_are_removed
      - id: "AC5"
        statement: |-
          AC5: every acceptance criterion of this contract names a falsifier that is also a dod_evidence check and runs an existing test file -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion
  - id: "req-precommit-hooks-from-core"
    statement: |-
      omnibase_spi's no-hardcoded-topics and no-untracked-todos pre-commit hooks come from omnibase_core, which exports them under the same hook ids, instead of from onex_change_control, with every exclude and setting unchanged.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: .pre-commit-config.yaml declares no-hardcoded-topics and no-untracked-todos once each, in an omnibase_core block pinned to a full commit sha, with each exclude and setting unchanged and only cosmetic-lint left in the onex_change_control block -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q
  - id: "req-no-occ-context"
    statement: |-
      omnibase_spi's S6 caller must pass no OCC context because admission no longer compares with OCC.
    acceptance:
      - id: "AC7"
        statement: |-
          AC7: the S6 caller passes no occ-context input because admission no longer compares with OCC -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_context
  - id: "req-cosmetic-lint-from-core"
    statement: |-
      omnibase_spi's cosmetic-lint pre-commit hook comes from omnibase_core, which exports it under the same hook id, instead of from onex_change_control, so no pre-commit block pins onex_change_control.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: .pre-commit-config.yaml declares cosmetic-lint once, with no settings, in an omnibase_core block pinned to a full commit sha, and no block pins onex_change_control -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q -k cosmetic
  - id: "req-codeql-from-core"
    statement: |-
      omnibase_spi's CodeQL caller uses omnibase_core's codeql-reusable.yml instead of onex_change_control's, with the job id, the inputs and the required context unchanged.
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: security-scan.yml's codeql job calls OmniNode-ai/omnibase_core/.github/workflows/codeql-reusable.yml at a full 40-character lowercase hexadecimal commit sha and names no onex_change_control, the job id, name and inputs are unchanged so the required context CodeQL / CodeQL Analysis (python) is unchanged, and the required-checks.yaml CodeQL row's cross_repo_ref names the omnibase_core file -- falsifier: uv run pytest tests/ci/test_codeql_from_core_omn20074.py -q
      - id: "AC13"
        statement: |-
          AC13: the CodeQL caller check accepts immutable full-sha pin updates while refusing branch names, tags, abbreviated or malformed shas, and other reusable paths -- falsifier: uv run pytest tests/ci/test_codeql_from_core_omn20074.py -q -k core_reusable
      - id: "AC14"
        statement: |-
          AC14: the repo-evidence caller check accepts immutable full-sha receipt-gate pin updates while refusing branch names, tags, abbreviated or malformed shas, the pre-floor omnibase_core#1914 pin, and other reusable paths -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k receipt_gate_pin
  - id: "req-contract-validation-core-validator"
    statement: |-
      omnibase_spi's contract-validation workflow validates the branch ticket's contract with omnibase_core's ModelTicketContract instead of onex_change_control's composite action, under unchanged workflow and job names.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: .github/workflows/contract-validation.yml names no onex_change_control (no auth preflight, no composite action, no validate-yaml), validates with omnibase_core's ModelTicketContract, and keeps its workflow name Contract Validation and its job name contract-validation -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k test_workflow_
      - id: "AC10"
        statement: |-
          AC10: the contract-validation step's own run block, run over this repository's contracts, passes the branch ticket's contract and every contracts/OMN-*.yaml, skips a branch with no ticket or no contract, and fails a planted binds_ac entry that is not a criterion label and a planted binds_ac item of check_type command_exit_0, each naming the file and the rule -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q
  - id: "req-s6-no-occ-callers"
    statement: |-
      omnibase_spi retires OCC callers at the S6 cut-over and validates repo-owned contracts with omnibase_core under the existing required context.
    acceptance:
      - id: "AC12"
        statement: |-
          AC12: the S6 cut-over: no workflow calls or checks out onex_change_control, the minting callers and their helper are deleted, the runner-IP caller pins a45ba68f, and Contract Compliance Check validates this repository's contracts with omnibase_core -- falsifier: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q
  - id: "req-remaining-occ-refs"
    statement: |-
      omnibase_spi drops the references to onex_change_control that nothing needs after the S6 cut-over: the validator-requirements spec, the CLAUDE.md evidence line, the skip-token hook remediation and the dep-provenance gate text.
    acceptance:
      - id: "AC15"
        statement: |-
          AC15: validator-requirements.yaml names no onex_change_control and takes no-hardcoded-topics and no-untracked-todos from omnibase_core, CLAUDE.md places evidence in contracts/<OMN-N>.yaml checked by repo-evidence / dod-verify, the skip-token hook remediation names no OCC contract, and the dep-provenance gate text and pyproject.toml name no onex-change-control -- falsifier: uv run pytest tests/ci/test_occ_remaining_refs_removed_omn20074.py -q
evidence_requirements:
  - kind: "tests"
    description: "The caller workflow has the required base-branch trigger and read-only permissions."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch"
  - kind: "tests"
    description: "The caller pins the current receipt-gate by full sha."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate"
  - kind: "tests"
    description: "The caller enforces with shadow false and compare-with-occ false."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k shadow_mode"
  - kind: "tests"
    description: "The OCC minting callers and their helper are deleted."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_callers_are_removed"
  - kind: "tests"
    description: "Every criterion of this contract is bound to a runnable check."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion"
  - kind: "tests"
    description: "Migrated hooks sit in an omnibase_core block at a full sha, excludes unchanged."
    command: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q"
  - kind: "tests"
    description: "The caller passes no occ-context input."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_context"
  - kind: "tests"
    description: "cosmetic-lint sits in an omnibase_core block at a full sha and no block pins onex_change_control."
    command: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q -k cosmetic"
  - kind: "tests"
    description: "The CodeQL caller uses the omnibase_core reusable at a full sha, shape unchanged."
    command: "uv run pytest tests/ci/test_codeql_from_core_omn20074.py -q"
  - kind: "tests"
    description: "The contract-validation workflow reads no onex_change_control and keeps its names."
    command: "uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k test_workflow_"
  - kind: "tests"
    description: "The contract-validation step admits the repo contracts and refuses both planted binds_ac shapes."
    command: "uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q"
  - kind: "tests"
    description: "The S6 cut-over retires OCC callers, pins runner-IP without nested preflight, and validates repo-owned contracts with core."
    command: "uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q"
  - kind: "tests"
    description: "Regression cases accept observed full-sha receipt-gate pins and reject mutable refs, malformed shas, the pre-floor pin and other reusable paths."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k receipt_gate_pin"
  - kind: "tests"
    description: "The references to onex_change_control that nothing needs are gone."
    command: "uv run pytest tests/ci/test_occ_remaining_refs_removed_omn20074.py -q"
