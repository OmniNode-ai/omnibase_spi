#
# CodeQL security and quality analysis for omnibase_spi.
# Calls the reusable workflow in omnibase_core.
# OMN-5422

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# OMN-19641: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  codeql:
    name: CodeQL
    uses: OmniNode-ai/omnibase_core/.github/workflows/codeql-reusable.yml@191675512e942a357fcbecfebdfd4ae858e5f093 # pinned omnibase_core rev (OMN-20074)
    with:
      language: python
      query_suite: security-and-quality
    permissions:
      actions: read
      contents: read
      security-events: write
