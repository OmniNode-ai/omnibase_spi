#
# Required-Check Skip-Vector Guard — caller for omnibase_spi. OMN-14859
# (fan-out from OMN-14854, the omniclaude canary build).
#
# Invokes the canonical reusable workflow hosted in omniclaude (single source
# of the validator, mirrors deploy-gate-reusable.yml@main's pattern):
#
#   OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main
#
# Produces required status check: "required-check-skip-guard / check-skip-vectors"
#
# NOT YET added to required_status_checks on this branch (see design spec
# section 5 ordering + .github/required-checks.yaml, where this context's
# manifest row is `mode: ADVISORY`). The branch-protection flip to REQUIRED
# happens in a follow-up PR only after this workflow has posted green on `dev`
# at least twice — never in the same PR that introduces the workflow, to avoid
# a self-inflicted wedge (a PR blocked on a required check that has never
# successfully run under real conditions).
#
# IMPORTANT: this trigger MUST NOT carry a `paths:`/`paths-ignore:` filter
# (design spec section 4c). This is the one required-check workflow that is
# exempt from "narrow the trigger for efficiency" — a path filter here would
# be the exact self-referential skip-vector this guard exists to catch.

name: Required-Check Skip-Vector Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  required-check-skip-guard:
    uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main
