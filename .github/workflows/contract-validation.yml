# Contract Validation Gate
#
# Validates ONEX ticket contracts for PRs in omnibase_spi with the validators
# from onex_change_control, checked out at the sha pinned in this file.
#
# Required status check: "contract-validation"
# Must pass (or skip) before merging to main.
#
# The validation is intentionally lenient on missing contracts:
# - If branch name has no OMN-XXXX ticket ID → skipped
# - If contracts/<ticket_id>.yaml does not exist → skipped
# - If contract file exists but fails schema validation → fails
#
# This prevents blocking PRs that legitimately have no contract
# (e.g., dependency bumps, docs-only changes) while enforcing schema
# correctness when a contract is present.

name: Contract Validation

on:
  pull_request:
    branches: [main, dev, develop]
  merge_group:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Branch name to validate contracts for (defaults to current branch)"
        required: false
        default: ""

# Allow concurrent runs on different PRs; cancel stale runs on the same ref
concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-validation:
    name: contract-validation
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Auth preflight — confirm onex_change_control action is accessible
        id: auth-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking visibility of OmniNode-ai/onex_change_control..."
          if gh api repos/OmniNode-ai/onex_change_control --silent; then
            echo "::notice::onex_change_control repo is accessible."
          else
            echo "::error::Cannot reach OmniNode-ai/onex_change_control. Composite action will not resolve."
            exit 1
          fi

      - name: Resolve branch name
        id: resolve-branch
        env:
          WORKFLOW_INPUT_BRANCH: ${{ inputs.branch-name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # merge_group events run on gh-readonly-queue/... branches with no PR head ref.
          # Contract validation is not meaningful in this context — skip immediately.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "resolved_branch=" >> "$GITHUB_OUTPUT"
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "::notice::merge_group event — contract validation skipped (validated on PR branch instead)."
            exit 0
          fi

          # Prefer workflow_dispatch input, then PR head ref, then ref name
          if [[ -n "$WORKFLOW_INPUT_BRANCH" ]]; then
            BRANCH="$WORKFLOW_INPUT_BRANCH"
          elif [[ -n "$GITHUB_HEAD_REF" ]]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi
          echo "resolved_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved branch name: $BRANCH"

          # Pre-check: skip early if no OMN-XXXX ticket ID in branch name.
          # The composite action has a known edge case where it may exit non-zero
          # when no ticket ID is found, even though the intent is to skip gracefully.
          # Performing the check here avoids invoking the composite action at all.
          TICKET_ID=$(echo "$BRANCH" | grep -oiE 'OMN-[0-9]+' | head -1)
          if [[ -z "$TICKET_ID" ]]; then
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No OMN-XXXX ticket ID found in branch — skipping contract validation."
          else
            echo "skip_validation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out calling repository
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Validators are read at this SHA (OMN-20001); bump it in this repo's own PR to move
      # validator versions. The OCC validate-contract composite action is not used because
      # its validator checkout resolves github.action_ref to the nested checkout's "v4".
      - name: Check out pinned contract validators
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/onex_change_control
          ref: 438cb38d8a0c017c1144f1066a2f907f72544c92
          path: .onex_change_control_validators
          persist-credentials: false

      - name: Set up uv
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Python 3.12
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        run: uv python install 3.12

      - name: Run contract validation
        id: validate-contract
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        env:
          BRANCH: ${{ steps.resolve-branch.outputs.resolved_branch }}
          UV_HTTP_TIMEOUT: "600"
        run: |
          set -euo pipefail

          TICKET_ID=$(printf '%s\n' "$BRANCH" | grep -ioE 'OMN-[0-9]+' | head -n 1 | tr '[:lower:]' '[:upper:]' || true)
          echo "ticket-id=$TICKET_ID" >> "$GITHUB_OUTPUT"

          CONTRACT_PATH="contracts/$TICKET_ID.yaml"
          if [[ ! -f "$CONTRACT_PATH" ]]; then
            CONTRACT_PATH="contracts/${TICKET_ID,,}.yaml"
          fi
          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "validation-status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::No contract file found for $TICKET_ID in contracts/; contract validation skipped."
            exit 0
          fi

          cd .onex_change_control_validators
          for attempt in 1 2 3; do
            if uv sync --no-group dev; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "validation-status=failed" >> "$GITHUB_OUTPUT"
              echo "::error::Failed to sync contract validators after 3 attempts."
              exit 1
            fi
            sleep "$((10 * attempt))"
          done

          if uv run validate-yaml "../$CONTRACT_PATH"; then
            echo "validation-status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "validation-status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report validation result
        if: always()
        env:
          TICKET_ID: ${{ steps.validate-contract.outputs.ticket-id }}
          VALIDATION_STATUS: ${{ steps.validate-contract.outputs.validation-status }}
          SKIP_VALIDATION: ${{ steps.resolve-branch.outputs.skip_validation }}
        run: |
          if [[ "$SKIP_VALIDATION" == "true" ]]; then
            echo "::notice::Contract validation SKIPPED — merge_group event."
            exit 0
          fi
          case "$VALIDATION_STATUS" in
            passed)
              echo "::notice::Contract validation PASSED for ticket $TICKET_ID"
              ;;
            skipped)
              if [[ -z "$TICKET_ID" ]]; then
                echo "::notice::Contract validation SKIPPED — no OMN-XXXX ticket ID found in branch name."
              else
                echo "::notice::Contract validation SKIPPED — no contract file found for $TICKET_ID in contracts/."
              fi
              ;;
            failed)
              echo "::error::Contract validation FAILED for ticket $TICKET_ID. See validate-contract step for details."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected validation status: '$VALIDATION_STATUS'. Treating as skipped."
              ;;
          esac
