# OMN-20298: no shape-gate detector job may depend on the change-control
# preflight (occ-preflight). The validator is consumed from omnibase_core
# (PR 1833); this workflow only runs it. Unconditional: no `needs:`, no `if:`.
# OMN-22360: the exported core runtime and hook share the ticket contract.

name: Shape-Gate Independence

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

concurrency:
  group: shape-gate-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shape-gate-independence:
    name: Shape-Gate Independence (OMN-20298)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Refuse shape-gate jobs that depend on occ-preflight
        run: |
          uv run --no-project \
            --with "$(uv run --no-project --with pyyaml python -c 'import pathlib,sys,yaml; print(yaml.safe_load(pathlib.Path(sys.argv[1]).read_text())["context"]["core_validation_requirement"])' contracts/OMN-22360.yaml)" \
            python -m omnibase_core.nodes.node_shape_gate_independence_check_effect.runtime_shape_gate_independence
