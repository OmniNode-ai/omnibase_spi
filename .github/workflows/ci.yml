name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: mypy strict
        run: uv run mypy src/omnibase_spi --strict

  spi-validation-gate:
    name: SPI Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run comprehensive SPI validator
        run: |
          uv run python scripts/validation/comprehensive_spi_validator.py \
            --json-report \
            --config validation_config.yaml \
            src/omnibase_spi/protocols

      - name: Run SPI protocol architecture validator
        run: |
          uv run python scripts/validation/validate_spi_protocols.py \
            src/ \
            --exclude-pattern exceptions.py \
            --exclude-pattern exceptions_skill_routing.py

      - name: Run unified standalone SPI validation suite
        run: python scripts/validation/run_all_validations.py --verbose

      - name: Upload SPI validation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spi-validation-gate-reports
          path: |
            comprehensive_spi_validation_*.json
            comprehensive_spi_validation_*.html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Detect Changes — emits matrix/split_count/is_full_suite for test-parallel.
  # When ENABLE_SMART_TESTS is off (default), emits 40-shard full-suite matrix.
  # When on and change set is small, emits a smaller matrix + selected_paths.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    needs: [lint, typecheck]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      is_full_suite: ${{ steps.detect.outputs.is_full_suite }}
      full_suite_reason: ${{ steps.detect.outputs.full_suite_reason }}
      split_count: ${{ steps.detect.outputs.split_count }}
      matrix: ${{ steps.detect.outputs.matrix }}
      selected_paths: ${{ steps.detect.outputs.selected_paths }}

    steps:
      # OMN-15118 vector-5 fix: `needs: [lint, typecheck]` alone lets GitHub's
      # implicit `success()`-over-needs skip this job when either upstream
      # fails/cancels, and a skipped job satisfies branch protection as
      # passing (this is a REQUIRED context on dev). `if: always()` above
      # stops the skip; this step is the other required half — it explicitly
      # fails the job when either dependency did not succeed, so the job's
      # own conclusion is FAILURE, never a decorative pass.
      - name: Fail when upstream lint/typecheck did not succeed
        if: needs.lint.result != 'success' || needs.typecheck.result != 'success'
        run: |
          echo "::error::lint result was ${{ needs.lint.result }}, typecheck result was ${{ needs.typecheck.result }}; refusing to run detect-changes."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Resolve test selection
        id: detect
        env:
          FLAG: ${{ vars.ENABLE_SMART_TESTS == 'true' && 'on' || 'off' }}
        run: |
          uv run python -m scripts.ci.detect_test_paths \
            --changed-files-from changed.txt \
            --ref-name "${{ github.ref_name }}" \
            --event-name "${{ github.event_name }}" \
            --feature-flag "$FLAG" \
            > selection.json
          cat selection.json
          is_full=$(jq -r '.is_full_suite' selection.json)
          reason=$(jq -r '.full_suite_reason // ""' selection.json)
          split_count=$(jq -r '.split_count' selection.json)
          matrix=$(jq -c '.matrix' selection.json)
          paths=$(jq -c '.selected_paths' selection.json)
          echo "is_full_suite=$is_full" >> "$GITHUB_OUTPUT"
          echo "full_suite_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "split_count=$split_count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Upload selection artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-selection
          path: selection.json
          retention-days: 7

  # Parallel test execution — matrix shape driven by detect-changes output.
  test-parallel:
    name: Tests (Split ${{ matrix.split }}/${{ needs.detect-changes.outputs.split_count }})
    needs: [lint, typecheck, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Restore test durations cache
        uses: actions/cache/restore@v6
        with:
          path: .test_durations
          key: test-durations-${{ github.sha }}
          restore-keys: |
            test-durations-

      - name: Run pytest (smart selection)
        if: vars.ENABLE_SMART_TESTS == 'true' && needs.detect-changes.outputs.is_full_suite == 'false'
        run: |
          paths=$(echo '${{ needs.detect-changes.outputs.selected_paths }}' | jq -r '.[]')
          uv run pytest $paths \
            --ignore=tests/integration \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --tb=short \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Run pytest (full suite)
        if: vars.ENABLE_SMART_TESTS != 'true' || needs.detect-changes.outputs.is_full_suite == 'true'
        run: |
          uv run pytest tests/ \
            --ignore=tests/integration \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --store-durations \
            --durations-path .test_durations \
            --tb=short \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Save test durations (full suite only, split 1)
        if: |
          needs.detect-changes.outputs.is_full_suite == 'true' &&
          matrix.split == 1 &&
          success()
        uses: actions/cache/save@v6
        with:
          path: .test_durations
          key: test-durations-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.split }}
          path: junit-${{ matrix.split }}.xml
          retention-days: 7

  build-and-verify:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test-parallel, contract-compliance]
    if: always()
    steps:
      # OMN-15118 vector-5 fix: `needs: [lint, typecheck, test-parallel,
      # contract-compliance]` alone lets GitHub's implicit `success()`-over-needs
      # skip this job when any of the four fails/cancels, and a skipped job
      # satisfies branch protection as passing (this is a REQUIRED context on
      # dev). `if: always()` above stops the skip; this step is the other
      # required half — it explicitly fails the job when any dependency did
      # not succeed, so the job's own conclusion is FAILURE, never a
      # decorative pass.
      - name: Fail when an upstream dependency did not succeed
        if: |
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.test-parallel.result != 'success' ||
          needs.contract-compliance.result != 'success'
        run: |
          echo "::error::upstream results — lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test-parallel=${{ needs.test-parallel.result }} contract-compliance=${{ needs.contract-compliance.result }}; refusing to run build-and-verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Build wheel and sdist
        run: uv build

      - name: Verify dist artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }
          echo "Build artifacts verified."

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          echo "pyproject.toml version: $PKG_VERSION"

          # Verify the wheel filename contains the correct version
          WHEEL=$(ls dist/*.whl)
          if [[ "$WHEEL" != *"$PKG_VERSION"* ]]; then
            echo "ERROR: wheel filename does not contain version $PKG_VERSION"
            echo "Wheel: $WHEEL"
            exit 1
          fi
          echo "Version consistency verified: $PKG_VERSION"

      - name: Install in clean environment and verify import
        run: |
          # Create a fresh venv without dev dependencies
          uv venv /tmp/test-install --python 3.12
          WHEEL=$(ls dist/*.whl)
          echo "Installing: $WHEEL"
          uv pip install "$WHEEL" --python /tmp/test-install/bin/python

          # Verify the package imports correctly
          /tmp/test-install/bin/python -c "
          import omnibase_spi
          from omnibase_spi.protocols import ProtocolLogger, ProtocolHealthMonitor
          from omnibase_spi.protocols.types import LiteralLogLevel
          from omnibase_spi.exceptions import SPIError

          # Verify Protocol classes are real protocols
          from typing import Protocol
          assert issubclass(ProtocolLogger, Protocol), 'ProtocolLogger is not a Protocol'
          assert issubclass(ProtocolHealthMonitor, Protocol), 'ProtocolHealthMonitor is not a Protocol'

          print(f'omnibase_spi imported successfully')
          print(f'Package location: {omnibase_spi.__file__}')
          print(f'Protocols verified: ProtocolLogger, ProtocolHealthMonitor')
          print(f'Types verified: LiteralLogLevel')
          print(f'Exceptions verified: SPIError')
          print('Clean environment install: PASSED')
          "

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz | tee SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  tests-gate:
    name: Tests Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-parallel]
    if: always()
    steps:
      - name: Evaluate tests gate
        run: |
          RESULT="${{ needs.test-parallel.result }}"
          if [ "${RESULT}" = "success" ]; then
            echo "Tests Gate PASSED (result=${RESULT})"
          else
            echo "Tests Gate FAILED: test-parallel result=${RESULT}"
            exit 1
          fi

  ai-slop-check:
    name: AI-Slop Pattern Check (strict, PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compute changed Python/Markdown files vs PR base
        id: changed
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --no-tags --depth=1
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- '*.py' '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 -- '*.py' '*.md' 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Check changed files for AI-slop patterns (strict)
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          python scripts/validation/check_ai_slop.py --strict $FILES


  contract-compliance:
    name: Contract Compliance Check
    # OMNI_RUNNER_SELECTOR_V1 (OMN-16438): upgraded from the stale pre-OMN-16413
    # inverted variant, which only checked `github.event_name != 'pull_request'`
    # and so routed EVERY pull_request event -- including trusted same-repo PRs --
    # to ubuntu-latest. `uv sync` here resolves onex_change_control's dependency
    # set from the internal-only `.201` Tailscale PyPI mirror
    # (http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/...).
    # onex-allow-internal-ip OMN-16438 reason="doc comment naming the host this fix routes around; not runnable"
    # `ubuntu-latest` is GitHub-hosted, non-tailnet, and cannot resolve that hostname.
    # Same defect class as OMN-16413 (omnibase_core#1579), OMN-16427
    # (omninode_infra#969), OMN-16428 (omnimarket), and OMN-16431 (omniclaude#2023) --
    # adopts the identical fork-aware selector: only an ACTUAL fork PR (head repo
    # != base repo) routes to the public ubuntu-latest runner; every same-repo
    # pull_request, push, and merge_group gets the tailnet-connected self-hosted
    # omnibase-ci fleet, which CAN reach the .201 mirror. This does NOT widen the
    # trust boundary: untrusted fork code still never reaches the self-hosted fleet.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Checkout onex_change_control
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          path: onex_change_control

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'onex_change_control/uv.lock'

      - name: Install onex_change_control
        working-directory: onex_change_control
        run: uv sync --all-extras

      - name: Validate contract YAML files
        working-directory: onex_change_control
        run: |
          # -maxdepth 1: contracts/v1/*.yaml is a deliberately different shape
          # (occ-contract/v1, validated by check-contract-shape-v1), not
          # ticket_contract. An unscoped recursive find walks into contracts/v1/
          # and fails every PR org-wide the moment any v1 contract exists,
          # regardless of this PR's own diff. Matches omnimarket's ci.yml.
          mapfile -t CONTRACTS < <(find "$GITHUB_WORKSPACE/onex_change_control/contracts" -maxdepth 1 -type f -name "OMN-*.yaml" 2>/dev/null)
          if [ "${#CONTRACTS[@]}" -eq 0 ]; then
            echo "No contract YAML files found — skipping validation"
            exit 0
          fi
          uv run validate-yaml "${CONTRACTS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omnibase_spi

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-verify, tests-gate, spi-validation-gate, no-noncanonical-lifecycle-classes]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          BUILD_AND_VERIFY_RESULT: ${{ needs.build-and-verify.result }}
          TESTS_GATE_RESULT: ${{ needs.tests-gate.result }}
          SPI_VALIDATION_GATE_RESULT: ${{ needs.spi-validation-gate.result }}
          NO_NONCANONICAL_LIFECYCLE_CLASSES_RESULT: ${{ needs.no-noncanonical-lifecycle-classes.result }}
        run: |
          # OMN-15304: this aggregator previously read `needs.*.result` only
          # through `contains(needs.*.result, 'failure'|'cancelled'|'skipped')`.
          # The required-check-skip-vector guard (vector-6-result-triage-
          # unverifiable) flags that as not provably fail-closed per-job: a glob
          # `contains()` over the whole needs.* set does not statically prove
          # that build-and-verify / tests-gate / spi-validation-gate are each
          # individually triaged on every non-success value, so dropping or
          # renaming one context could silently stop gating it. Fixed with an
          # explicit four-way `case` per job (the omnimarket#1926 / OMN-15296
          # shape): only `success` passes, `failure`/`cancelled`/`skipped` all
          # fail closed by name, and a `*` default-deny branch catches any
          # result value GitHub may add later. Applies to every job this
          # aggregator reads, including the pre-existing
          # no-noncanonical-lifecycle-classes check (OMN-14350) and the
          # OMN-13875 skip-detection rationale below (build-and-verify goes
          # `skipped`, not `failure`, when ITS upstreams fail).
          check_result() {
            local job_name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "  ${job_name}: success"
                ;;
              failure)
                echo "::error::${job_name} failed (result: ${result}) - fail-closed (OMN-15304)"
                exit 1
                ;;
              cancelled)
                echo "::error::${job_name} was cancelled, so it produced no verdict - fail-closed (OMN-15304)"
                exit 1
                ;;
              skipped)
                echo "::error::${job_name} was skipped - fail-closed (OMN-15304). A skipped required-check dependency must never read as passing evidence; build-and-verify in particular goes 'skipped' (not 'failure') when its own upstreams (lint, typecheck, test-parallel, contract-compliance) fail or are skipped (OMN-13875)."
                exit 1
                ;;
              *)
                echo "::error::Unrecognised result '${result}' for ${job_name} - failing closed by default-deny (OMN-15304)."
                exit 1
                ;;
            esac
          }

          check_result "no-noncanonical-lifecycle-classes" "${NO_NONCANONICAL_LIFECYCLE_CLASSES_RESULT}"
          check_result "build-and-verify" "${BUILD_AND_VERIFY_RESULT}"
          check_result "tests-gate" "${TESTS_GATE_RESULT}"
          check_result "spi-validation-gate" "${SPI_VALIDATION_GATE_RESULT}"
          echo "All required jobs passed"
