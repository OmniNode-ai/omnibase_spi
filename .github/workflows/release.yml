name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.13.0)'
        required: true
      sync_only:
        description: >-
          Skip every publishing step and move main to the tag's commit only.
          For a tag whose artifacts are ALREADY published and whose main sync
          failed: the publishing half is irreversible and must not be retried,
          while the pointer half is idempotent and safe to repeat.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        if: ${{ !inputs.sync_only }}
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        if: ${{ !inputs.sync_only }}
        run: uv build

      - name: Verify dist artifacts exist
        if: ${{ !inputs.sync_only }}
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      - name: Verify PyPI dependency-pin resolvability (OMN-14070)
        if: ${{ !inputs.sync_only }}
        # omnimarket 0.4.6 was published pinning a nonexistent
        # omnibase-compat==0.5.1 (OMN-14064) because nothing anywhere resolved
        # a package's declared [project.dependencies] pins against the real
        # PyPI index -- local/CI resolution is silently short-circuited by
        # [tool.uv.sources] git-rev overrides, which `uv build` bakes past
        # unverified into the wheel's real Requires-Dist metadata. This step
        # installs the just-built wheel with `uv pip install` (never
        # `uv sync`/`uv add`, so [tool.uv.sources] is structurally
        # unreachable) into a bare scratch venv with no project config, so a
        # broken pin fails the release *before* `uv publish` runs.
        run: |
          python3 scripts/ci/verify_pypi_pin_resolvability.py dist/

      - name: Publish to PyPI
        if: ${{ !inputs.sync_only }}
        run: |
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        if: ${{ !inputs.sync_only }}
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.sync_only }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

      # OMN-16289: main = the last release. Once a release publishes
      # successfully, fast-forward main to the released tag's commit SHA.
      # This is a non-force push of an already-proven dev SHA (release
      # tags are cut from dev; dev CI + this job already validated it).
      # Promotion PRs to main are retired -- main protection now empties
      # required_status_checks on main and restricts pushes to this job's
      # automation identity.
      #
      # OMN-16343: the workflow GITHUB_TOKEN cannot be authorized by main's
      # push restriction (proven live on omnibase_core, GH006, 2026-08-21),
      # so mint an installation token for the org-owned app
      # onexbot-occ-writer and push with that identity instead.
      #
      # OMN-17272: the steps from here down are the ONLY ones a sync_only run
      # executes, and they carry no sync_only guard on purpose. The two halves
      # of a release fail with very different consequences: publishing is
      # irreversible, and the pointer move is idempotent. Run 35304497808
      # published 0.23.4 and then failed here, which left the irreversible half
      # done and the repeatable half undone -- and with no way to retry only
      # the repeatable one, because re-dispatching the whole workflow would
      # have re-uploaded artifacts the index already holds. sync_only is that
      # missing entry point. It cannot silently skip the proof: the readback
      # below is outside the guard too, so a sync-only run that does not move
      # the ref still fails.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}

      - name: Sync main to release tag
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          # The ref moves over REST, NOT through git's credential layer.
          #
          # This replaced an OMN-17272 mitigation that unset
          # `http.https://github.com/.extraheader` from the LOCAL git config.
          # That worked when it was written and silently stopped working:
          # actions/checkout v7 no longer writes the credential there. It writes
          # it into a separate file and links it, which the run log shows
          # directly --
          #
          #   git config --file .../git-credentials-<uuid>.config \
          #     http.https://github.com/.extraheader AUTHORIZATION: basic ***
          #   git config --local includeIf.gitdir:<repo>/.git.path <that file>
          #
          # -- so the unset matched nothing, was swallowed by its own `|| true`,
          # and the included header still overrode the App token in the push
          # URL. The push then authenticated as github-actions[bot], which is
          # not a bypass actor for the OMN-16289 ruleset, and was declined with
          # GH013. Run 35304497808 failed exactly there, AFTER publishing
          # 0.23.4 to PyPI: the sync is the last step, so the irreversible half
          # had already happened.
          #
          # REST has no such failure mode. The identity is bound to the
          # Authorization header this request sends and no git config can
          # override it, and `"force": false` keeps the server-side
          # fast-forward guard. This is the same call omnibase_infra,
          # omnibase_core and omniclaude already use.
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            --data "{\"sha\":\"${TAG_SHA}\",\"force\":false}"
          echo "main fast-forwarded to $TAG_SHA ($TAG)"

      - name: Read the pointer back
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A sync that reports success without reading the pointer back cannot
          # tell a moved ref from an accepted request. The GH013 failure above
          # was loud, but the class it belongs to -- a push that looks like it
          # worked while the ruleset declined it -- is exactly what OMN-16343
          # found silently on omnibase_core.
          expected="$(git rev-list -n 1 "${RELEASE_TAG}")"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::main reads back as ${actual}, not ${expected}. The sync did not land."
            exit 1
          fi
          echo "::notice::readback confirms main == ${actual}"
