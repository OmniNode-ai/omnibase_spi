name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.13.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        run: uv build

      - name: Verify dist artifacts exist
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      - name: Verify PyPI dependency-pin resolvability (OMN-14070)
        # omnimarket 0.4.6 was published pinning a nonexistent
        # omnibase-compat==0.5.1 (OMN-14064) because nothing anywhere resolved
        # a package's declared [project.dependencies] pins against the real
        # PyPI index -- local/CI resolution is silently short-circuited by
        # [tool.uv.sources] git-rev overrides, which `uv build` bakes past
        # unverified into the wheel's real Requires-Dist metadata. This step
        # installs the just-built wheel with `uv pip install` (never
        # `uv sync`/`uv add`, so [tool.uv.sources] is structurally
        # unreachable) into a bare scratch venv with no project config, so a
        # broken pin fails the release *before* `uv publish` runs.
        run: |
          python3 scripts/ci/verify_pypi_pin_resolvability.py dist/

      - name: Publish to PyPI
        run: |
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

      # OMN-16289: main = the last release. Once a release publishes
      # successfully, fast-forward main to the released tag's commit SHA.
      # This is a non-force push of an already-proven dev SHA (release
      # tags are cut from dev; dev CI + this job already validated it).
      # Promotion PRs to main are retired -- main protection now empties
      # required_status_checks on main and restricts pushes to this job's
      # automation identity.
      #
      # OMN-16343: the workflow GITHUB_TOKEN cannot be authorized by main's
      # push restriction (proven live on omnibase_core, GH006, 2026-08-21),
      # so mint an installation token for the org-owned app
      # onexbot-occ-writer and push with that identity instead.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          # Contents-write ONLY (OMN-17272). A release tag may change a
          # workflow, and the *git push* transport refuses that without the
          # App `workflows` permission (core run 33525584540) -- a permission
          # this org installation does not carry and cannot mint (core runs
          # 33538784420 / 33540250010). The sync step below therefore moves
          # main via the REST ref-update API: the tag commit already exists
          # server-side, so contents:write suffices -- the exact mechanism
          # omnimarket's sync-main job live-proved through its ACTIVE
          # OMN-16289 ruleset on 2026-08-31.
          permission-contents: write

      # OMN-17272: this is a REST ref-update, NOT `git push`, on purpose.
      # Two live-proven failure classes killed the push transport here:
      #   1. actions/checkout persists the job GITHUB_TOKEN as an
      #      http.<origin>.extraheader Authorization header that overrides
      #      the push-URL credential, so the push authenticated as
      #      github-actions[bot] -- GH013 from the OMN-16289 ruleset, and
      #      GitHub refuses to accept GitHub Actions as a ruleset bypass
      #      actor ("The following actor(s) are invalid: GitHub Actions").
      #   2. Even authenticated as the App, a push whose range touches
      #      .github/workflows/** requires the App `workflows` permission
      #      (core run 33525584540), which the installation cannot mint
      #      (core run 33540250010). The REST update moves main to a commit
      #      that already exists server-side, so contents:write suffices --
      #      live-proven by omnimarket's sync-main through its ACTIVE
      #      ruleset on 2026-08-31.
      - name: Sync main to release tag
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          case "$TAG_SHA" in
            *[!0-9a-f]*)
              echo "::error::resolved tag SHA contains non-hex characters: $TAG_SHA"
              exit 1
              ;;
          esac
          if [ "${#TAG_SHA}" -ne 40 ]; then
            echo "::error::resolved tag SHA is not 40 hex chars: $TAG_SHA"
            exit 1
          fi
          curl -fsS \
            -X PATCH \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -d "{\"sha\":\"${TAG_SHA}\",\"force\":false}"
          echo "main fast-forwarded to $TAG_SHA ($TAG)"
