#
# OMN-22895: TruffleHog secret scanning with a planted control.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # OMN-22895: secret scanning. This repository is public, so the job runs on a hosted runner and
  # never on an internal one. The action pin is the one the reference security-scan workflow of this
  # organization carries.
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Secret Scanning (push diff)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Remove when a released trufflehog tag carries upstream PR 5188.
          extra_args: --only-verified --exclude-detectors=lob

      - name: TruffleHog Secret Scanning (full scan)
        if: github.event_name != 'push'
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        with:
          path: ./
          # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Remove when a released trufflehog tag carries upstream PR 5188.
          extra_args: --only-verified --exclude-detectors=lob

      # OMN-22895: the planted control. Reads the whole history for the control token declared in
      # .github/trufflehog-control.yml; an added token turns this step red.
      - name: TruffleHog planted control
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        with:
          path: ./
          extra_args: --config=.github/trufflehog-control.yml --include-detectors=CustomRegex --results=unverified --no-verification
