#
# OMN-22895: TruffleHog secret scanning with a planted control.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The TruffleHog scanner the secret scan runs, by immutable digest: the same value omnimarket's
  # security-scan.yml pins. The TruffleHog action only wraps a `docker run` of
  # ghcr.io/trufflesecurity/trufflehog:latest, so pinning the action pinned nothing that scans.
  # Resolved from :latest on 2026-11-07, when :latest and :3.99.8 both pointed at this digest.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a

jobs:
  # OMN-22895: secret scanning. This repository is public, so the job runs on a hosted runner and
  # never on an internal one. The scanner is the image omnimarket's security-scan.yml runs, by the
  # same digest; the steps rebuild the arguments the TruffleHog action built.
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Dropping it is its own reviewed change, not part of a digest bump.
      - name: TruffleHog Secret Scanning (push diff)
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
        run: |
          # The action's explicit base/head path: resolve both, refuse an empty range.
          git status >/dev/null
          base_commit=$(git rev-parse "$BASE" 2>/dev/null) || true
          head_commit=$(git rev-parse "$HEAD" 2>/dev/null) || true
          if [ "$base_commit" == "$head_commit" ]; then
            echo "::error::BASE and HEAD commits are the same. TruffleHog won't scan anything."
            exit 1
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      - name: TruffleHog Secret Scanning (full scan)
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The action's event path: a pull request scans base..head, a schedule
          # or manual run scans the whole history.
          git status >/dev/null
          BASE=""
          HEAD=""
          if [ "$EVENT_NAME" == "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      # OMN-22895: the planted control. Reads the history of the checked-out head for the control
      # token declared in .github/trufflehog-control.yml; an added token turns this step red. The
      # head is named so a planted token on another branch of the clone never reddens this run.
      - name: TruffleHog planted control
        run: |
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --branch HEAD \
            --fail \
            --no-update \
            --github-actions \
            --config=.github/trufflehog-control.yml \
            --include-detectors=CustomRegex \
            --results=unverified \
            --no-verification
