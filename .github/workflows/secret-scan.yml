#
# Secret scan for omnibase_spi, nightly on the default branch and on every push to one.
#
# The CodeQL workflow of this repository (security-scan.yml) runs no secret scanner, so this is
# its own workflow: the rebuild plan's safety source 1 reads this file's latest successful run
# that was not a pull request. The scan and its planted and clean controls are
# in secret-scan-reusable.yml of omnibase_core.
# It is not a pull request workflow (the pull-request workflow budget refuses a new one).

name: Secret Scan

on:
  push:
    branches: [main, dev]
  schedule:
    # Nightly full-history scan of the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    uses: OmniNode-ai/omnibase_core/.github/workflows/secret-scan-reusable.yml@341c08161857d1207dc8433960f0097960dbf9bc # pinned omnibase_core rev, the branch head until it merges
    permissions:
      contents: read
