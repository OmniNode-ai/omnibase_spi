name: Check Architecture Handshake

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, dev, develop]
  merge_group:
  workflow_dispatch:

# OMN-19641: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  check-handshake:
    name: Check architecture handshake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout omnibase_core
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
                                                                                # Auto-bumped by omnibase_core publish-downstream-pin-bump.yml to 2ca615af292a.
          ref: 2ca615af292a52898359d23538299f3bc0880f07
          path: omnibase_core
          token: ${{ secrets.OMNIBASE_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify omnibase_core checkout
        run: |
          if [ ! -f omnibase_core/architecture-handshakes/check-handshake.sh ]; then
            echo "::error::Failed to checkout omnibase_core or check-handshake.sh not found."
            echo "If omnibase_core is private, ensure OMNIBASE_CORE_TOKEN secret is set."
            exit 1
          fi

      - name: Check architecture handshake
        run: bash omnibase_core/architecture-handshakes/check-handshake.sh
