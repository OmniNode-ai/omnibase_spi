name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# OMN-19641: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  pr-title:
    # OMN-20996: run the published title decision under the required context.
    name: pr-title / check-title
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # OMN-15012: the validator's broad workflow keyword is not coverage.
      # Keep the node's runtime dependency in the scoped requirements file.
      - name: Checkout node requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/pr-title-node/requirements.txt
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Check PR title for ticket reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OMNIMARKET_VERSION: "0.4.310"
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr-title-check"
          uv venv --quiet --python 3.12 "${venv}"
          uv pip install --quiet --python "${venv}/bin/python" --no-deps "omnimarket==${OMNIMARKET_VERSION}"
          uv pip install --quiet --python "${venv}/bin/python" --requirements .github/pr-title-node/requirements.txt
          "${venv}/bin/python" -I -c 'import json, os; print(json.dumps({"title": os.environ["PR_TITLE"], "author": os.environ["PR_AUTHOR"]}))' \
            | "${venv}/bin/python" -I -m omnimarket.nodes.node_pr_title_check_compute
