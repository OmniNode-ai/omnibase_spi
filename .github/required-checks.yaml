# required-checks.yaml v3 (OMN-14859 — fan-out of OMN-14854's schema v3 guard;
# RECONCILED 2026-07-25 under OMN-15120 fan-out from the omnimarket#1895 canary)
# Location: .github/required-checks.yaml
#
# This file is the OPERATIONAL input to the Required-Check Skip-Vector Guard
# (validate_no_required_check_skip_vectors.py, canonical source in
# OmniNode-ai/omniclaude). The reusable workflow fetches the validator from
# omniclaude@main and runs it against THIS manifest + this repo's own
# .github/workflows/ directory (required-check-skip-guard-caller.yml).
#
# Exhaustive: every context in required_status_checks.contexts for BOTH
# omnibase_spi branches has a `mode: REQUIRED` row below, verified 2026-07-25 via
# `gh api repos/OmniNode-ai/omnibase_spi/branches/{dev,main}/protection/required_status_checks`
# and diffed with the canonical `reconcile_manifest_vs_live.py --branch <dev|main>`
# (OMN-15117 per-branch `branch:` field support, canonical source: omniclaude/dev).
# dev = 21 contexts, main = 17 contexts (dev superset). Every REQUIRED row below
# now carries an optional `branch: dev` field (OMN-15117 schema extension) when
# the context is required on dev ONLY; a row with no `branch:` field is required
# on BOTH branches. Drift found and corrected at this pass: "Detect Changes" was
# previously documented as dev-only but is now live-required on main too (no
# `branch:` tag); "pr-title / check-title" was previously undocumented as
# single-branch but is live-required on dev only (added `branch: dev`).
# Post-reconcile: `reconcile_manifest_vs_live.py --branch dev` and `--branch main`
# both PASS (empty diff) — see PR body for full command output.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so a reconcile job (not yet built for this repo) never
# observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); cross_repo rows carry
# caller_workflow/caller_job/cross_repo_ref instead, per the design spec's
# context->job resolution algorithm (OMN-14854 ticket, spec section 1).

schema_version: 3
classification: toolchain
repo: omnibase_spi

gates:
  - name: "CI Summary"
    mode: REQUIRED
    producer_kind: local
    workflow: ci.yml
    job_path: ["ci-summary"]
    skip_semantics: never
    result_triage: waived
    rationale: "Fail-closed aggregator (if: always()) over build-and-verify, tests-gate, spi-validation-gate, no-noncanonical-lifecycle-classes. Live required status check on omnibase_spi dev branch protection. result_triage WAIVED pending OMN-16165 (vector-6: needs.*.result triage for build-and-verify/tests-gate/spi-validation-gate is not provably fail-closed on non-success values) -- filed 2026-08-18, unstarted; ratifying the pre-existing local-hook block encountered while landing an unrelated workflow-file change (OMN-16289) rather than fixing the triage logic here, out of scope for that ticket."

  - name: "call-reject-skip-token / scan / reject-skip-gate-token"
    mode: REQUIRED
    producer_kind: cross_repo
    caller_workflow: call-reject-skip.yml
    caller_job: call-reject-skip-token
    cross_repo_ref: "OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@main"
    skip_semantics: never
    rationale: "Skip-token bypass scanner (OMN-10347/10422/10971), reusable hosted in omniclaude. Live required status check on omnibase_spi dev branch protection."

  - name: "Dep Provenance Gate"
    mode: REQUIRED
    branch: dev
    producer_kind: local
    workflow: dep-provenance-gate.yml
    job_path: ["dep-provenance-gate"]
    skip_semantics: never
    rationale: "OMN-13873 first-party git-source override gate. Live required status check on omnibase_spi dev branch protection only (verified 2026-07-25)."

  - name: "PEP 604 Type Union Check (UP007)"
    mode: REQUIRED
    producer_kind: local
    workflow: omni-standards-compliance.yml
    job_path: ["type-union-check"]
    skip_semantics: never
    rationale: "Live required status check on omnibase_spi dev branch protection."

  - name: "CI Naming Convention"
    mode: REQUIRED
    producer_kind: local
    workflow: omni-standards-compliance.yml
    job_path: ["ci-naming-convention"]
    skip_semantics: never
