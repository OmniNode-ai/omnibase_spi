    mode: REQUIRED
    producer_kind: local
    workflow: ci.yml
    job_path: ["ci-summary"]
    skip_semantics: never
    rationale: "Fail-closed aggregator (if: always()) over build-and-verify, tests-gate, spi-validation-gate, no-noncanonical-lifecycle-classes. Live required status check on omnibase_spi dev branch protection."

  - name: "call-reject-skip-token / scan / reject-skip-gate-token"
    mode: REQUIRED
    producer_kind: cross_repo
    caller_workflow: call-reject-skip.yml
    caller_job: call-reject-skip-token
    cross_repo_ref: "OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@main"
    skip_semantics: never
    rationale: "Skip-token bypass scanner (OMN-10347/10422/10971), reusable hosted in omniclaude. Live required status check on omnibase_spi dev branch protection."

